{% extends 'base.html' %}{% block title %}Feedback | CodeClarity{% endblock %}{% block content %}
<div class="page-heading"><p class="dashboard-label">HELP US IMPROVE</p><h1>Share your feedback</h1><p>Tell us what works well and what we can improve.</p></div><div class="card form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="rating">Your rating</label><select class="field-control" id="rating" name="rating"><option value="">Choose a rating (optional)</option><option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3">3 - Average</option><option value="2">2 - Needs improvement</option><option value="1">1 - Poor</option></select><label for="message">Your feedback</label><textarea class="field-control" id="message" name="message" rows="7" maxlength="5000" required placeholder="Write your suggestions or report a problem…"></textarea><button class="primary-btn" type="submit">Submit feedback</button></form></div>{% endblock %}
